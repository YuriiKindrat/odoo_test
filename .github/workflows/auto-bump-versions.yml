name: Auto Bump Module Versions

on:
  push:
    branches:
      - 'feature/**'
      - 'bug/**'
      - 'fix/**'

permissions:
  contents: write

concurrency:
  group: auto-bump-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  auto-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if auto-bump commit
        id: check
        run: |
          MSG=$(git log -1 --format="%s")
          if echo "$MSG" | grep -qF "[skip-bump]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Auto-bump commit detected, skipping."
          fi

      - name: Fetch develop
        if: steps.check.outputs.skip != 'true'
        run: git fetch origin develop

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run version bump script
        if: steps.check.outputs.skip != 'true'
        run: python3 scripts/auto_bump_versions.py

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
          else
            git add custom_addons/
            git commit -m "auto: bump module versions [skip-bump]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi